# Gateway error messages (api-design.md §5.7) — gateway.* maps 1:1 to GatewayError
gateway.token_missing=An authentication token is required
gateway.token_invalid=The authentication token is not valid
gateway.token_expired=The access token has expired
gateway.auth_service_unavailable=The authentication service is temporarily unavailable. Please try again later
gateway.downstream_unavailable=The service is temporarily unavailable
gateway.permission_denied=This path cannot be called with this token
gateway.route_not_found=This API path does not exist
gateway.rate_limited=The request limit has been exceeded. Please try again later
gateway.internal_error=An internal server error occurred
